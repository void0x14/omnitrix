[package]
name = "ork-daemon"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Omnitrix daemon — multiagent orchestration runtime"

[[bin]]
name = "orkd"
path = "src/main.rs"

[dependencies]
ork-router = { workspace = true }
ork-runtime = { workspace = true }
ork-tui = { workspace = true }
ork-provider = { workspace = true }
ork-storage = { workspace = true }
ork-notify = { workspace = true }
ork-record = { workspace = true }
ork-backup = { workspace = true }
ork-webui = { workspace = true }
xai-grok-config = { workspace = true }
xai-grok-agent = { workspace = true, optional = true }
xai-grok-tools = { workspace = true, optional = true }
xai-chat-state = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
toml = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true }
dirs = { workspace = true }

[features]
poc-managed-agent = ["xai-grok-agent", "xai-grok-tools", "xai-chat-state", "uuid"]

[lints]
workspace = true
