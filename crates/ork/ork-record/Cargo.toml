
[package]
name = "ork-record"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Session recording & replay for Omnitrix multiagent runs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
blake3 = "1"
zstd = "0.13"
chrono = "0.4"
async-trait = "0.1"
anyhow = "1"
parking_lot = "0.12"
ork-storage = { path = "../ork-storage" }
rusqlite = { workspace = true }
