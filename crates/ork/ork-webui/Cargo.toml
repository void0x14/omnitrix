
[package]
name = "ork-webui"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Web dashboard UI for Omnitrix multiagent orchestration"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
axum = { version = "0.8", features = ["macros", "ws"] }
tower = "0.5"
tower-http = "0.6"
thiserror = "2"
tracing = "0.1"
futures = "0.3"
tokio-stream = "0.1"
anyhow = "1"
