[package]
name = "omnitrix"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Omnitrix daemon — multiagent orchestration runtime"

[[bin]]
name = "omnitrix"
path = "src/main.rs"

[dependencies]
omni-router = { workspace = true }
omni-scheduler = { workspace = true }
omni-tui = { workspace = true }
omni-provider = { workspace = true }
omni-storage = { workspace = true }
omni-notify = { workspace = true }
omni-record = { workspace = true }
omni-backup = { workspace = true }
omni-webui = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true }
xai-grok-config = { workspace = true }
xai-grok-agent = { workspace = true, optional = true }
xai-grok-tools = { workspace = true, optional = true }
xai-chat-state = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
toml = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true }
dirs = { workspace = true }

[features]
poc-managed-agent = ["xai-grok-agent", "xai-grok-tools", "xai-chat-state", "uuid"]

[lints]
workspace = true
