[package]
name = "omni-scheduler"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Multiagent scheduler, hierarchy, interrupt, penalty, persona management for Omnitrix"

[dependencies]
xai-grok-agent = { workspace = true }
xai-chat-state = { workspace = true }
# Faz 3: Bolum 2 `SubagentBackend` sozlesmesi ve tipleri (I2 tek yon: salt okuma).
xai-grok-tools = { workspace = true }
xai-tool-runtime = { workspace = true }
# AS2 (Bolum 2): mid-stream abort. Interjection tamponu + sentetik kullanici
# mesaji bicimlemesi burada; taseri kesen `SamplerHandle::cancel` sampler'da.
xai-interjection-core = { workspace = true }
xai-grok-sampler = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# AS13 problem-sure kural tablosu (`duration.rs`) config/duration.toml'u okur.
toml = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
parking_lot = { workspace = true }
dashmap = { workspace = true }
zstd = { workspace = true }
blake3 = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
tokio-util = { workspace = true }
libc = { workspace = true }
omni-storage = { workspace = true }
omni-proto = { workspace = true }
# Faz 7: duplike ResearchMode kaldirildi; butce tek kaynaktan (omni-research
# modes.rs) gelir, scheduler kendi mod enum'u icat etmez (I3).
omni-research = { workspace = true }
# 19.1: ajana calisirken mesaj enjekte — kuyruk satiri + birlestirme kurallari
# tek yerden gelir (I2 tek yon: salt okuma).
xai-prompt-queue = { workspace = true }
xai-system-power = { workspace = true }
# Kok Cargo.toml'da [workspace.dependencies] girdisi yok; depodaki diger
# tuketiciler de (xai-chat-state, xai-grok-shell) path ile bagliyor.
xai-grok-compaction = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
