[runtime]
max_active_agents = "auto"
mem_high_watermark_mb = 0
swap_out_idle_ms = 30000
max_depth = 5

[router]
default_strategy = "fallback"
grounding = "required"

[record]
video = false
dom = false
events = true

[notify]
escalation = false

# Gozlemlenebilirlik (AS9, Bolum 16). Orta RAM: seyrek ornekleme, kisa
# retention, Prometheus kapali. sampling_ratio 0.0..=1.0; retention_secs = 0
# sinirsiz demektir; max_series = 0 tavansiz demektir.
[observability]
enabled = true
sampling_ratio = 0.1
retention_secs = 900
max_series = 512
prometheus = false
service_name = "omnitrix"
