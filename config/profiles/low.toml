[runtime]
max_active_agents = 2
mem_high_watermark_mb = 1024
swap_out_idle_ms = 15000
max_depth = 2

[router]
default_strategy = "fallback"
grounding = "required"

[record]
video = false
dom = false
events = true

[notify]
escalation = false

# Gozlemlenebilirlik (AS9, Bolum 16). Low profilde tamamen KAPALI: K2 RAM
# disiplini. Bu blokta enabled = true yazilsa bile omni-core kapali kabul eder.
[observability]
enabled = false
sampling_ratio = 0.0
retention_secs = 0
max_series = 0
prometheus = false
service_name = "omnitrix"
