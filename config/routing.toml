# config/routing.toml — yonlendirme modlari + rol->model baglamalari
# (MASTER-PLAN 10.1 / 10.2, AS7, I5)
#
# Semayi okuyan (P1.4 kopru): crates/codegen/xai-grok-sampler/src/routing_config.rs
#   - parse_routing_config  : bu dosyayi ayristirir + [jep] rol degerlerini dogrular
#   - resolve_strategy      : 'strategy' degerini canonical mod ID'ye cozer
# Katalog: config/routing_modes.toml (xai-grok-shell::util::routing_catalog)
#
# MODEL ADI BURADA DA GOMULU DEGILDIR (I5): zincir girdileri model adi yerine
# ROL verir; rol calisma zamaninda `config/models.toml` + gomulu katalog
# (`xai-grok-models::DEFAULT_MODELS_JSON`) uzerinden cozulur.

# Varsayilan mod (P1.4): canonical mod ID (katalogdaki id) veya legacy alias.
#   Canonical ornekler: fallback-strict | rr | wrr | jep-classic (10.1)
#   Legacy alias tablosu (bilinen eski degerler, kopru tarafindan cozulur):
#     fallback    -> fallback-strict   (katli zincir; hata/bakiye-bitti olunca bir alta gecilir)
#     round_robin -> rr                (yuk canli anahtarlara esit dagitilir)
#     weighted    -> wrr               (yuk agirlikli dagitilir)
#     jep         -> jep-classic       (Judge-Executor-Planner rolleri asagidaki [jep]'ten)
#   Bilinmeyen/boş deger sessiz fallback DEGIL — kopru turlu hata doner.
strategy = "fallback"

# Kanit kipi (10.3): required | preferred | off
grounding = "required"

# `provider_health` tablosunun okundugu SQLite dosyasi; verilmezse canlilik
# suzgeci uygulanmaz.
# health_db = "omnitrix.db"

# ---------------------------------------------------------------------------
# Aday zincir. Sirasi onemlidir (fallback yukaridan asagi iner).
# Her blokta ya `role` (katalogdan cozulur — TERCIH EDILEN) ya da dogrudan
# `model` verilir. `weight` yalnizca `weighted` modunda anlamlidir.
# ---------------------------------------------------------------------------
# [[provider]]
# provider = "<provider-adi>"   # providers.name
# role     = "executor"          # model katalogdan cozulur (AS7/I5)
# weight   = 1.0

# [[provider]]
# provider = "<yedek-provider>"
# role     = "executor"
# weight   = 1.0

# ---------------------------------------------------------------------------
# JEP rol secimi (10.1). Degerler ROL ADIDIR, model adi degil.
# Gecerli roller: judge · executor · planner · summary · web_search
# ---------------------------------------------------------------------------
[jep]
planner  = "planner"
executor = "executor"
judge    = "judge"

# ---------------------------------------------------------------------------
# Devre kesici (xai-circuit-breaker). Alanlar opsiyonel; verilmeyen alan
# kod tarafindaki varsayilanla doldurulur.
# ---------------------------------------------------------------------------
# [circuit_breaker]
# enabled              = true
# window_secs          = 60
# min_samples          = 2
# error_rate_threshold = 0.5
# open_secs            = 30
# half_open_max_probes = 1

# ---------------------------------------------------------------------------
# Butce zarfi (AS4). Hepsi opsiyonel.
# ---------------------------------------------------------------------------
# [budget]
# max_tokens     = 0
# max_cost       = 0.0
# max_latency_ms = 0
